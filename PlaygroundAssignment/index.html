<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCSR Ranked</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <header>MCSR Ranked</header>

  <div class="container">

    
    <div class="card">
      <img src="images/minecraft1.png" alt="Download">
      <div class="card-content">
        <div class="card-title">Download</div>
        <div class="card-desc">Download the MCSR Ranked Client</div>
      </div>
      <button>Download</button>
    </div>

    
    <div class="card">
      <img src="images/minecraft2.png" alt="Leaderboard">
      <div class="card-content">
        <div class="card-title">Leaderboard</div>
        <div class="card-desc">Check out the top players</div>
      </div>
      <button>Leaderboard</button>
    </div>

    
    <div class="card">
      <img src="images/minecraft3.png" alt="Community">
      <div class="card-content">
        <div class="card-title">Community</div>
        <div class="card-desc">Join our community of 25,000+ members to connect with other players, share strategies, and participate in events.</div>
      </div>
      <button>Join</button>
    </div>

  </div>

</body>
